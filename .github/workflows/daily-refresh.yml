name: Daily Market Refresh

# 美股收盘后自动抓取最新数据并提交，GitHub Pages 会自动重新部署。
# 时间说明：UTC 20:30 ≈ 美东 16:30（夏令时），即收盘后半小时。
# 若美国进入冬令时，把下方 cron 改成 '30 21 * * 1-5'。
on:
  schedule:
    - cron: '30 20 * * 1-5'
  workflow_dispatch:   # 允许在 GitHub 网页手动点一次

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取最新行情
        run: python3 refresh.py

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.js
          if git diff --quiet --cached; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
